# Deployment of the architecture in figur 4.3: Backend API (+ Async Worker),
# PostgreSQL/PostGIS and a self-hosted OSRM. The Mobile Client runs on the
# user's phone.
#
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# By default the Async Worker is the launch variant from afsnit 4.3.4.5: a
# background process inside the Backend API container, so no broker is
# needed. The Celery/Redis target architecture is opt-in via a profile:
#
#   ASYNC_WORKER=celery docker compose -f infrastructure/docker-compose.yml --profile celery up --build
#
# Known limitation of the celery profile: the zone cache is in memory and the
# dev-time stores are SQLite files, so data the worker container computes is
# not visible to the backend container until the Datalag moves to PostgreSQL.
services:
  # Datalag (target schema; created with `alembic upgrade head`)
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: saferoute
      POSTGRES_PASSWORD: saferoute
      POSTGRES_DB: saferoute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Rutemotor, self-hosted (NF6/NF7). Build the graph first: infrastructure/osrm/README.md
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      ASYNC_WORKER: ${ASYNC_WORKER:-background}
      DATABASE_URL: postgresql://saferoute:saferoute@postgres:5432/saferoute
      REDIS_URL: redis://redis:6379/0
      OSRM_SERVER_URL: http://osrm:5000
    volumes:
      - backend_data:/app/data  # dev-time SQLite stores (users, reports, news archive)
    depends_on:
      - postgres
      - osrm
    ports:
      - "8000:8000"

  # Broker for the Celery Async Worker (target architecture only)
  redis:
    image: redis:7-alpine
    profiles: ["celery"]
    ports:
      - "6379:6379"

  # Async Worker, target architecture: Celery worker + Beat, same image as the backend
  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: celery -A app.worker.celery_app worker --beat -l info
    profiles: ["celery"]
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://saferoute:saferoute@postgres:5432/saferoute
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  backend_data:
