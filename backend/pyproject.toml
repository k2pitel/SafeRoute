# Tool configuration for the SafeRoute backend. Dependencies stay pinned in
# requirements.txt (used by CI and the Docker image).
[project]
name = "saferoute-backend"
version = "0.1.0"
description = "SafeRoute: Backend API, Async Worker and Datalag"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/datalag/migrations/*"]

[tool.ruff]
target-version = "py311"  # matches CI
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
